server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip the usual text-ish assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Reverse proxy to the Django backend container so the SPA can call
    # a same-origin /api and never worry about CORS or hard-coded hosts.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
    }

    # SPA fallback: any non-file route resolves to index.html so
    # react-router's client-side routing works on a hard refresh/deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html stays revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
